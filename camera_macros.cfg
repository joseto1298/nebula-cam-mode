[gcode_macro CAMERA_DAY]
description: Forzar modo día (filtro IR puesto, color, LEDs apagados)
gcode:
    RUN_SHELL_COMMAND CMD=CAM_MODE_DAY

[gcode_macro CAMERA_NIGHT]
description: Forzar modo noche (filtro IR quitado, BN, LEDs encendidos)
gcode:
    RUN_SHELL_COMMAND CMD=CAM_MODE_NIGHT

[gcode_macro CAMERA_AUTO_CAM]
description: Modo auto (sensor interno de la cámara)
gcode:
    RUN_SHELL_COMMAND CMD=CAM_MODE_AUTO

[gcode_macro CAMERA_STATUS]
description: Mostrar estado completo de la cámara
gcode:
    RUN_SHELL_COMMAND CMD=CAM_MODE_STATUS

[gcode_macro CAMERA_INFO]
description: Mostrar firmware y capacidades de la cámara
gcode:
    RUN_SHELL_COMMAND CMD=CAM_MODE_INFO

[gcode_macro CAMERA_EXPOSURE_MANUAL]
description: Exposición manual. Parámetro: EXP_VAL (1-1000, default 500)
gcode:
    {% set exp = params.EXP_VAL|default(500)|int %}
    RUN_SHELL_COMMAND CMD=CAM_MODE_EXPOSE_MANUAL PARAMS={exp}

[gcode_macro CAMERA_EXPOSURE_AUTO]
description: Exposición automática
gcode:
    RUN_SHELL_COMMAND CMD=CAM_MODE_EXPOSE_AUTO

[gcode_macro CAMERA_BRIGHTNESS_UP]
description: Sube el brillo en 10 unidades
gcode:
    RUN_SHELL_COMMAND CMD=CAM_MODE_BRIGHTNESS_UP

[gcode_macro CAMERA_BRIGHTNESS_DOWN]
description: Baja el brillo en 10 unidades
gcode:
    RUN_SHELL_COMMAND CMD=CAM_MODE_BRIGHTNESS_DOWN

