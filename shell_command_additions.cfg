###########################
# CÁMARA NEBULA
###########################
[gcode_shell_command CAM_MODE_STATUS]
# Estado completo: IR mode + V4L2 controls
command: sudo python3 ~/nebula-cam-mode/nebula_cam_mode.py status
timeout: 5.
verbose: True

[gcode_shell_command CAM_MODE_INFO]
# Firmware y capacidades
command: sudo python3 ~/nebula-cam-mode/nebula_cam_mode.py info
timeout: 5.
verbose: True

[gcode_shell_command CAM_MODE_DAY]
# Fuerza modo DÍA: filtro IR puesto, imagen color, LEDs apagados
command: sudo python3 ~/nebula-cam-mode/nebula_cam_mode.py day
timeout: 5.
verbose: True

[gcode_shell_command CAM_MODE_NIGHT]
# Fuerza modo NOCHE: filtro IR quitado, imagen BN, LEDs encendidos
command: sudo python3 ~/nebula-cam-mode/nebula_cam_mode.py night
timeout: 5.
verbose: True

[gcode_shell_command CAM_MODE_AUTO]
# Modo AUTO: el firmware decide según el sensor de luz
command: sudo python3 ~/nebula-cam-mode/nebula_cam_mode.py auto
timeout: 5.
verbose: True

[gcode_shell_command CAM_MODE_EXPOSE_MANUAL]
# Exposición manual con valor específico: expose manual <val>
# PARAMS se pasa desde la macro CAMERA_EXPOSURE_MANUAL
command: sudo python3 ~/nebula-cam-mode/nebula_cam_mode.py expose manual
timeout: 5.
verbose: True

[gcode_shell_command CAM_MODE_EXPOSE_AUTO]
# Exposición automática
command: sudo python3 ~/nebula-cam-mode/nebula_cam_mode.py expose auto
timeout: 5.
verbose: True

[gcode_shell_command CAM_MODE_BRIGHTNESS_UP]
# Brillo +10
command: sudo python3 ~/nebula-cam-mode/nebula_cam_mode.py brightness_up
timeout: 5.
verbose: True

[gcode_shell_command CAM_MODE_BRIGHTNESS_DOWN]
# Brillo -10
command: sudo python3 ~/nebula-cam-mode/nebula_cam_mode.py brightness_down
timeout: 5.
verbose: True